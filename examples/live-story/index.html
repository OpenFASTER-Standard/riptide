<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Story So Far — a Riptide example</title>
  <style>
    :root {
      --parchment: #f6ecd9;
      --ink: #3a2e1f;
      --gold: #b8860b;
      --line-bg: #fffaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--parchment);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    main {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-top: 0;
    }

    .subtitle a {
      color: var(--gold);
    }

    #story {
      max-height: 50vh;
      overflow-y: auto;
      margin: 1.5rem 0;
      padding-right: 0.5rem;
    }

    .line {
      background: var(--line-bg);
      border-left: 3px solid var(--gold);
      padding: 0.6rem 0.9rem;
      margin: 0 0 0.6rem 0;
      border-radius: 0 6px 6px 0;
      animation: fade-in 0.5s ease-out;
    }

    .line-author {
      display: block;
      font-size: 0.8rem;
      opacity: 0.65;
      margin-top: 0.25rem;
      font-style: italic;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #story-form {
      display: flex;
      gap: 0.5rem;
    }

    #line-input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--gold);
      border-radius: 6px;
      background: var(--line-bg);
      color: var(--ink);
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--line-bg);
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #toggle-raw {
      margin-top: 1.5rem;
      background: transparent;
      color: var(--ink);
    }

    #raw-data-container {
      display: none;
      margin-top: 0.75rem;
    }

    #raw-data-container.visible {
      display: block;
    }

    .raw-data-label {
      font-size: 0.85rem;
      opacity: 0.75;
    }

    #raw-data {
      background: var(--ink);
      color: var(--parchment);
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Story So Far</h1>
    <p class="subtitle">
      A story everyone here is writing together, live — powered by
      <a href="https://github.com/OpenFASTER-Standard/riptide" target="_blank" rel="noopener">Riptide</a>.
      You are <strong id="guest-name">...</strong>.
    </p>

    <div id="story" aria-live="polite"></div>

    <form id="story-form">
      <input
        id="line-input"
        type="text"
        placeholder="Add the next line..."
        autocomplete="off"
        maxlength="280"
        required
      />
      <button type="submit">Add line</button>
    </form>

    <button id="toggle-raw" type="button">Peek at the data</button>
    <div id="raw-data-container">
      <p class="raw-data-label">
        Raw Turtle triples for the most recent line — this is really Linked Data, not a chat log:
      </p>
      <pre id="raw-data"></pre>
    </div>
  </main>

  <script>
    // Defaults to local dev; override via a `?base=` query param (no trailing
    // slash) to point this standalone page at any other running Riptide
    // instance — e.g. a Fly.io deployment — without editing this file.
    const BASE_URL = new URLSearchParams(window.location.search).get("base") || "http://localhost:4000";
    const TENANT_ID = "story-demo";
    const STORY_PATH = `/tenants/${TENANT_ID}/resources/the-story`;
    const STREAM_ID = `https://riptide.example/tenants/${TENANT_ID}/resources/the-story`;
    const TEXT_PRED = "http://schema.org/text";
    const AUTHOR_PRED = "http://schema.org/author";
    const TYPE_PRED = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type";
    const CREATIVE_WORK = "http://schema.org/CreativeWork";

    const GUEST_ADJECTIVES = [
      "Wandering", "Sleepy", "Curious", "Gentle", "Restless", "Radiant", "Quiet", "Daring",
    ];
    const GUEST_NOUNS = ["Fox", "Comet", "Otter", "Lantern", "Sparrow", "Willow", "Ember", "Tide"];

    function guestName() {
      let name = sessionStorage.getItem("guestName");
      if (!name) {
        const adjective = GUEST_ADJECTIVES[Math.floor(Math.random() * GUEST_ADJECTIVES.length)];
        const noun = GUEST_NOUNS[Math.floor(Math.random() * GUEST_NOUNS.length)];
        name = `the ${adjective} ${noun}`;
        sessionStorage.setItem("guestName", name);
      }
      return name;
    }

    function escapeTurtleLiteral(value) {
      // Mirrors Riptide's own short-form Turtle string escaping exactly
      // (deps/rdf/lib/rdf/serializations/turtle_trig/encoder.ex's
      // escape_string/3 with long: false). This demo only ever submits
      // single-line text (an <input type="text"> can't contain a newline),
      // so the server always re-serializes it short-form on read anyway —
      // writing short-form here too keeps escaping symmetric and avoids a
      // triple-quoted literal whose content ends in an unescaped `"`
      // colliding with its own closing `"""` (a real, confirmed-live bug:
      // a submitted line like `He said "run!"` produced `""""` at the end
      // and the server rejected the PATCH with a 400).
      return value
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r")
        .replace(/\t/g, "\\t");
    }

    function unescapeTurtleLiteral(value) {
      return value.replace(/\\"\\"\\"/g, '"""').replace(/\\\\/g, "\\");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function unescapeShortTurtleLiteral(value) {
      return value.replace(/\\(.)/g, (_, ch) => {
        switch (ch) {
          case "n": return "\n";
          case "r": return "\r";
          case "t": return "\t";
          case "b": return "\b";
          case "f": return "\f";
          case '"': return '"';
          case "\\": return "\\";
          default: return ch;
        }
      });
    }

    function extractLiteral(turtle, predicateIri) {
      const pattern = new RegExp(
        `<${escapeRegExp(predicateIri)}>\\s+(?:"""([\\s\\S]*?)"""|"((?:[^"\\\\]|\\\\.)*)")`
      );
      const match = turtle.match(pattern);
      if (!match) return null;
      return match[1] !== undefined
        ? unescapeTurtleLiteral(match[1])
        : unescapeShortTurtleLiteral(match[2]);
    }

    function renderLine(turtle) {
      const text = extractLiteral(turtle, TEXT_PRED);
      const author = extractLiteral(turtle, AUTHOR_PRED);
      if (text === null) return;

      const storyEl = document.getElementById("story");
      const lineEl = document.createElement("p");
      lineEl.className = "line";

      const textSpan = document.createElement("span");
      textSpan.className = "line-text";
      textSpan.textContent = text;

      const authorSpan = document.createElement("span");
      authorSpan.className = "line-author";
      authorSpan.textContent = `— ${author || "anonymous"}`;

      lineEl.appendChild(textSpan);
      lineEl.appendChild(authorSpan);
      storyEl.appendChild(lineEl);
      storyEl.scrollTop = storyEl.scrollHeight;

      document.getElementById("raw-data").textContent = turtle;
    }

    let lastSequence = 0;

    function handleSseEvent(rawEvent) {
      let id = null;
      const dataLines = [];

      for (const line of rawEvent.split("\n")) {
        if (line.startsWith("id: ")) {
          id = parseInt(line.slice(4), 10);
        } else if (line.startsWith("data: ")) {
          dataLines.push(line.slice(6));
        }
      }

      if (id !== null) lastSequence = id;
      if (dataLines.length > 0) renderLine(dataLines.join("\n"));
    }

    async function subscribeOnce() {
      // Deliberately NOT the native EventSource API: browsers only let
      // EventSource set Last-Event-ID automatically, on its own automatic
      // reconnects — never on the very first connection — so there is no way
      // to ask a fresh EventSource for the backlog from cursor 0. fetch() lets
      // us set the header explicitly instead.
      const response = await fetch(
        `${BASE_URL}/streams/${encodeURIComponent(STREAM_ID)}/subscribe`,
        { headers: { "Last-Event-ID": String(lastSequence) } }
      );

      if (response.status === 409) {
        console.warn("Cursor fell out of the retention window — resetting to 0");
        lastSequence = 0;
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          handleSseEvent(buffer.slice(0, boundary));
          buffer = buffer.slice(boundary + 2);
        }
      }
    }

    async function subscribeForever() {
      while (true) {
        try {
          await subscribeOnce();
        } catch (err) {
          console.error("SSE connection lost, reconnecting in 1s", err);
        }
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
    }

    async function submitLine(text) {
      const lineId = `urn:uuid:${crypto.randomUUID()}`;
      const author = guestName();
      const additions =
        `<${lineId}> <${TYPE_PRED}> <${CREATIVE_WORK}> ;\n` +
        `  <${TEXT_PRED}> "${escapeTurtleLiteral(text)}" ;\n` +
        `  <${AUTHOR_PRED}> "${escapeTurtleLiteral(author)}" .\n`;

      const response = await fetch(`${BASE_URL}${STORY_PATH}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ additions, removals: "" }),
      });

      if (!response.ok) {
        throw new Error(`PATCH failed: ${response.status}`);
      }
    }

    document.getElementById("story-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("line-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await submitLine(text);
      } catch (err) {
        console.error(err);
        alert("Couldn't add your line — is Riptide running? Check the console for details.");
      }
    });

    document.getElementById("toggle-raw").addEventListener("click", () => {
      document.getElementById("raw-data-container").classList.toggle("visible");
    });

    document.getElementById("guest-name").textContent = guestName();
    subscribeForever();
  </script>
</body>
</html>
