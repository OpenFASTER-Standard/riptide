apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: riptide
  labels:
    app: riptide
spec:
  serviceName: riptide-headless
  replicas: 3
  selector:
    matchLabels:
      app: riptide
  template:
    metadata:
      labels:
        app: riptide
      annotations:
        # No-op unless a Prometheus configured for annotation-based scrape
        # discovery is present in the cluster — see README.md's "Metrics"
        # section. Shipped on by default rather than left as a README-only
        # step an operator has to remember to add themselves.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: riptide
          image: ghcr.io/openfaster-standard/riptide:latest
          securityContext:
            # Matches the Dockerfile's own `USER riptide` (uid/gid 1000) —
            # defense in depth, not a bypass: the image already never runs
            # as root, this just makes Kubernetes enforce the same thing
            # even if a future image change regresses that.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          ports:
            - name: http
              containerPort: 4000
            - name: metrics
              containerPort: 9090
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PHX_SERVER
              value: "true"
            # "riptide-headless" (the StatefulSet's own headless Service, k8s/headless-service.yaml)
            # is correct for internal Erlang clustering with no public TLS configured yet. Once
            # you apply k8s/ingress.yaml + k8s/cluster-issuer.yaml, change this to the real public
            # hostname you configured there (e.g. "riptide.example.com") — Socket.check_origin for
            # the /replication WebSocket validates against this value, and force_ssl's redirect
            # target depends on it matching what clients actually connect to.
            - name: PHX_HOST
              value: "riptide-headless"
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: riptide-secrets
                  key: RELEASE_COOKIE
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: riptide-secrets
                  key: SECRET_KEY_BASE
          volumeMounts:
            - name: data
              mountPath: /data
          # readinessProbe calls Riptide.Placement.lookup/1, which retries
          # across every currently-known placement-cluster member on failure.
          # Each attempt carries :ra's own 5000ms default query timeout
          # (deps/ra/src/ra.hrl's DEFAULT_TIMEOUT), so a fully-unreachable
          # placement cluster can take up to ~15s to resolve to a 503.
          # timeoutSeconds is set to 5s (one member attempt's worth) rather
          # than k8s's 1s default, which was already too short even for a
          # single healthy attempt under any real network latency or
          # in-flight leader election.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
