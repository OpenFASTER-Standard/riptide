\* Vacuity-probe config for VSR_Probe.tla. NOT part of the shipped invariant set.
\* Exactly ONE probe invariant at a time (TLC stops at the first violation, so probing several
\* at once only reports whichever is found first). scripts/probe-vacuity rewrites the INVARIANT
\* line below for each probe in turn; the constants are VSR.cfg's own, verbatim, so a probe
\* result is evidence about the SHIPPED bound and not about some other one.
\*
\* A "violated" result is the SUCCESS case here -- it proves the corresponding piece of the
\* recovery machinery is genuinely reachable at this bound.
SPECIFICATION Spec
CONSTANTS
    ReplicaCount = 3
    Values = {v1}
    StartViewOnTimerLimit = 1
    MaxOp = 1
    CorruptLimit = 1
    RestartLimit = 1
    ForfeitLimit = 1
INVARIANT NoStartViewShortensALog
CHECK_DEADLOCK FALSE
SYMMETRY ValuesSymmetry
