\* THROWAWAY finiteness-probe config for the task-4 draft recovery extension.
\* Deliberately checks ONLY NoUnboundedGrowth: this run is asking "is the reachable state space
\* finite?", not "is the draft protocol safe?" (it is not -- it accumulates nacks and never uses
\* them). Adding VSR.cfg's safety invariants here would let a safety violation halt the run
\* before the finiteness question is answered.
SPECIFICATION Spec
CONSTANTS
    ReplicaCount = 3
    Values = {v1}
    StartViewOnTimerLimit = 1
    MaxOp = 1
    FaultLimit = 1
INVARIANT NoUnboundedGrowth
CHECK_DEADLOCK FALSE
SYMMETRY ValuesSymmetry
