\* Wider bound than the shipped VSR.cfg: two distinct values, so NoLogDivergence and
\* AcknowledgedWritesExistOnMajority stop being structurally unfalsifiable, and MaxOp raised in
\* lockstep per VSR.tla's own ASSUME MaxOp >= Cardinality(Values).
\*
\* Same invariant set as VSR.cfg, verbatim -- this run is asking "do the shipped invariants
\* still hold when they can actually discriminate?", so removing any of them would defeat the
\* purpose. RestartLimit/CorruptLimit/ForfeitLimit are left at the shipped bound: widening the
\* value domain and the fault budget at the same time would make a non-terminating result
\* uninterpretable (you would not know which widening caused it).
SPECIFICATION Spec
CONSTANTS
    ReplicaCount = 3
    Values = {v1, v2}
    StartViewOnTimerLimit = 1
    MaxOp = 2
    CorruptLimit = 1
    RestartLimit = 1
    ForfeitLimit = 1
INVARIANT TypeOK
INVARIANT CommitNumberNeverHigherThanOpNumber
INVARIANT LogLengthMatchesOpNumber
INVARIANT OpNumberWithinMaxOp
INVARIANT StorageWellFormed
INVARIANT NeverNackCorruptOrHeld
INVARIANT RecvDvcValidWhenViewChange
INVARIANT DvcEntriesAgreeWithinLogView
INVARIANT NoLogDivergence
INVARIANT AcknowledgedWritesExistOnMajority
INVARIANT NoCommittedOpProvablyAbsent
INVARIANT AcknowledgedWritesReadableSomewhere
INVARIANT StartViewNeverDropsACommittedOp
INVARIANT StartViewCoversItsOwnCommitPoint
INVARIANT NoUnboundedGrowth
CHECK_DEADLOCK FALSE
SYMMETRY ValuesSymmetry
