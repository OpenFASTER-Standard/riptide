\* VSR_Wide's bound (Values = {v1, v2}, MaxOp = 2) with ForfeitViewChange disabled outright.
\* See VSR_WideNoForfeit.tla's own header for why: VSR_Wide does not terminate, and the
\* forfeit escape is the one action the HasDvcQuorum counterexample never uses, so removing
\* its branching factor is the cheapest route to an EXHAUSTIVE widened-bound result.
\*
\* Invariant set is VSR.cfg's, verbatim -- same reasoning as VSR_Wide.cfg: this run asks "do
\* the SHIPPED invariants hold at two distinct values?", so dropping any would defeat it.
SPECIFICATION Spec
CONSTANTS
    ReplicaCount = 3
    Values = {v1, v2}
    StartViewOnTimerLimit = 1
    MaxOp = 2
    CorruptLimit = 1
    RestartLimit = 1
    ForfeitLimit = 0
INVARIANT TypeOK
INVARIANT CommitNumberNeverHigherThanOpNumber
INVARIANT LogLengthMatchesOpNumber
INVARIANT OpNumberWithinMaxOp
INVARIANT StorageWellFormed
INVARIANT NeverNackCorruptOrHeld
INVARIANT RecvDvcValidWhenViewChange
INVARIANT DvcEntriesAgreeWithinLogView
INVARIANT NoLogDivergence
INVARIANT AcknowledgedWritesExistOnMajority
INVARIANT NoCommittedOpProvablyAbsent
INVARIANT AcknowledgedWritesReadableSomewhere
INVARIANT StartViewNeverDropsACommittedOp
INVARIANT StartViewCoversItsOwnCommitPoint
INVARIANT NoUnboundedGrowth
CHECK_DEADLOCK FALSE
SYMMETRY ValuesSymmetry
